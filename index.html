<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1677ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>GAMEFINITY Mobile</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#182230;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e9f0;padding:15px;display:flex;justify-content:space-between;z-index:2}.brand{font-weight:950;color:#1677ff;font-size:21px}.status{padding:8px 11px;border-radius:99px;background:#fff0f0;color:#c62828;font-weight:900;font-size:12px}.ok{background:#eaf8ef;color:#14823a}.wrap{max-width:900px;margin:auto;padding:14px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:18px;padding:17px;box-shadow:0 5px 20px #00000008}.login .card{width:min(430px,100%)}input{width:100%;padding:16px;border:1px solid #cdd6e1;border-radius:13px;font-size:18px;margin:12px 0}button{width:100%;border:0;border-radius:13px;padding:16px;background:#1677ff;color:#fff;font-weight:950;font-size:16px;min-height:54px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:16px}.label{font-size:11px;color:#697586;font-weight:800}.value{font-size:22px;font-weight:950;margin-top:5px}.green{color:#14823a}.red{color:#c62828}.section{margin-top:12px}.sale{padding:13px 0;border-bottom:1px solid #edf0f4}.row{display:flex;justify-content:space-between;gap:12px}.small{font-size:12px;color:#6b7685}.amount{font-weight:950}.hide{display:none!important}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:360px){.value{font-size:18px}}
</style></head><body><div id="app"></div><script>
const app=document.getElementById('app');let state={totals:{},recent:[],caixa:null,operadores:[]},online=false,source=null;const money=n=>new Intl.NumberFormat('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n||0))+' CVE';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function login(){app.innerHTML='<div class="login"><div class="card"><div class="brand">GAMEFINITY</div><h1>📱 Controle Mobile</h1><div class="small">Acompanhe vendas, caixa e operadores em tempo real.</div><input id="pin" type="password" inputmode="numeric" maxlength="12" placeholder="PIN"><button onclick="entrar()">ENTRAR</button></div></div>';}
function entrar(){const p=document.getElementById('pin').value.trim();if(!p)return;localStorage.gfPin=p;render();connect();}
function connect(){if(source)try{source.close()}catch{};source=new EventSource('/api/events');source.onopen=()=>{online=true;render()};source.onerror=()=>{online=false;render()};source.onmessage=e=>{try{state=JSON.parse(e.data);online=true;render()}catch{}}}
async function initial(){if(!localStorage.gfPin){login();return}try{const r=await fetch('/api/state');const j=await r.json();if(j.ok)state=j.state}catch{}render();connect()}
function render(){if(!localStorage.gfPin){login();return}const t=state.totals||{};app.innerHTML='<header class="top"><div><div class="brand">GAMEFINITY</div><div class="small">Controle Mobile</div></div><div class="status '+(online?'ok':'')+'">'+(online?'● ONLINE':'● OFFLINE')+'</div></header><main class="wrap"><div class="grid"><div class="card metric"><div class="label">VENDAS</div><div class="value">'+money(t.total)+'</div></div><div class="card metric"><div class="label">Nº VENDAS</div><div class="value">'+(t.quantidade||0)+'</div></div><div class="card metric"><div class="label">DINHEIRO</div><div class="value green">'+money(t.dinheiro)+'</div></div><div class="card metric"><div class="label">VINT4 / TPA</div><div class="value">'+money(t.vint4)+'</div></div><div class="card metric"><div class="label">TRANSFERÊNCIA</div><div class="value">'+money(t.transferencia)+'</div></div><div class="card metric"><div class="label">CAIXA</div><div class="value '+(state.caixa?'green':'red')+'">'+(state.caixa?'ABERTA':'FECHADA')+'</div></div><div class="card metric"><div class="label">ATUALIZADO</div><div class="value" style="font-size:15px">'+(state.updatedAt?new Date(state.updatedAt).toLocaleTimeString('pt-PT'):'—')+'</div></div><div class="card metric"><div class="label">OPERADORES</div><div class="value">'+((state.operadores||[]).length)+'</div></div></div><section class="card section"><h2>🧾 Últimas vendas</h2>'+((state.recent||[]).length?state.recent.slice(0,20).map(v=>'<div class="sale"><div class="row"><div><b>'+esc(v.numDoc||'Venda')+'</b><div class="small">'+esc(v.operador||'—')+' · '+esc(v.cliente||'Consumidor Final')+'</div><div class="small">'+esc(v.metodoPagamento||'—')+' · '+esc(v.dataHora||v.data||'')+'</div></div><div class="amount">'+money(v.total)+'</div></div></div>').join(''):'<div class="small">Nenhuma venda recebida ainda.</div>')+'</section><section class="card section"><h2>👥 Operadores</h2>'+((state.operadores||[]).length?state.operadores.map(o=>'<div class="sale"><div class="row"><div><b>'+esc(o.nome||'Operador')+'</b><div class="small">'+esc(o.role||'')+'</div></div><div class="amount">'+money(state.recent.filter(v=>String(v.operador)===String(o.nome)).reduce((s,v)=>s+Number(v.total||0),0))+'</div></div></div>').join(''):'<div class="small">Nenhum operador.</div>')+'</section><button class="section" style="background:#263238" onclick="sair()">SAIR</button><button class="section" style="background:#eef5ff;color:#1677ff" onclick="alert(\'No iPhone: Partilhar → Adicionar ao ecrã principal. No Android: menu ⋮ → Adicionar ao ecrã principal.\')">📱 ADICIONAR À TELA INICIAL</button></main>'}
function sair(){localStorage.removeItem('gfPin');if(source)source.close();online=false;login()}initial();
</script></body></html>
